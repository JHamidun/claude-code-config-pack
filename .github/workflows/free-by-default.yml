name: free-by-default guard

# The pack must install and run with ZERO third-party API keys — everything
# works on the user's Claude subscription. That promise lives in text files
# inside .claude/, which is periodically re-synced wholesale from a personal
# config; the sync overwrites files and has already silently deleted this
# policy twice (16 -> 10 -> 0 files, 2026-07-21 .. 2026-07-31).
#
# This job is the tripwire: if a sync eats the guard again, the push fails
# here instead of shipping to users.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: NO-KEY guard + free-by-default policy present
        run: python guard_free_by_default.py --check

      - name: Show what a repair would change (only on failure)
        if: failure()
        run: |
          echo "::error::free-by-default policy eroded — run: python guard_free_by_default.py --apply"
          python guard_free_by_default.py --dry-run || true

      - name: No live API key ships in the credentials template
        run: |
          # placeholders must stay commented out: a non-empty placeholder makes
          # every `if not os.getenv(...)` guard think the key is configured
          # ОБА файла. Полный каталог переменных — .claude/templates/…; в корне после
          # переезда осталась записка о новом адресе. Пока проверялся только корень,
          # проверка проходила на файле без единой переменной, а настоящий список
          # (248 строк) не смотрел никто.
          fail=0
          for f in .claude/templates/.credentials.master.env.example .credentials.template.env; do
            if [ ! -f "$f" ]; then
              echo "::error::credentials template missing: $f"
              fail=1
              continue
            fi
            if grep -nE '^[A-Za-z0-9_]*(KEY|TOKEN|SECRET|PASSWORD|HASH|SID)[A-Za-z0-9_]*=' "$f"; then
              echo "::error::uncommented secret-ish var in $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "template OK"
