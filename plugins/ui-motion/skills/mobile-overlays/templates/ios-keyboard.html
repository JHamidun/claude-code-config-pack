<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>iOS keyboard overlay — demo</title>
<style>
  /* ===== демо-обвязка (в прототип не копировать) ===== */
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: #f2f2f7;
  }
  .phone {
    position: relative; width: 390px; height: 700px; margin: 24px auto;
    background: #fff; border-radius: 24px; overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,.18);
  }
  .screen { padding: 24px 16px; }
  .screen h1 { font-size: 22px; margin-bottom: 16px; }
  #ios-input {
    width: 100%; padding: 12px 14px; font-size: 17px;
    border: 1px solid #c7c7cc; border-radius: 10px; outline: none;
    caret-color: #007aff;
  }
  #ios-input:focus { border-color: #007aff; }

  /* ===== сама клавиатура — копируй отсюда ===== */
  .ios-keyboard {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 291px;                        /* стандарт iPhone c нижней полосой */
    background: #d1d3d9;
    padding: 8px 3px 4px;
    display: flex; flex-direction: column; gap: 10px;
    transform: translateY(100%);
    transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
    user-select: none; -webkit-user-select: none;
  }
  .ios-keyboard[data-open="true"] { transform: translateY(0); }

  .ios-kb-row { display: flex; justify-content: center; gap: 6px; padding: 0 3px; }
  .ios-key {
    flex: 1; max-width: 36px; height: 42px;
    background: #fff; border: 0; border-radius: 5px;
    box-shadow: 0 1px 0 #898a8d;
    font: 400 22px/42px -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #000; text-align: center; padding: 0;
    cursor: pointer;
  }
  .ios-key:active { background: #b8bbc1; }
  .ios-key--special {
    max-width: 46px; background: #adb3bc;
    font-size: 15px; font-weight: 400;
  }
  .ios-key--shift, .ios-key--bksp { font-size: 18px; }
  .ios-key--space { max-width: 190px; flex: 4; font-size: 16px; }
  .ios-key--return { max-width: 92px; flex: 2; background: #adb3bc; font-size: 16px; }
  .ios-kb-bottom { display: flex; justify-content: center; gap: 6px; padding: 0 3px; }
  .ios-kb-homebar {
    width: 134px; height: 5px; border-radius: 3px;
    background: #000; opacity: .85; margin: 6px auto 0;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <h1>Новое сообщение</h1>
      <input id="ios-input" type="text" placeholder="Введите текст" autocomplete="off">
    </div>
    <div id="ios-keyboard" class="ios-keyboard"></div>
  </div>

<script>
  /* ===== логика клавиатуры — копируй вместе с CSS выше ===== */
  (function () {
    const ROWS = [
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l'],
      ['⇧','z','x','c','v','b','n','m','⌫'],
    ];
    const kb = document.getElementById('ios-keyboard');
    const input = document.getElementById('ios-input');
    let shift = false;

    function render() {
      kb.innerHTML = '';
      ROWS.forEach(function (row) {
        const div = document.createElement('div');
        div.className = 'ios-kb-row';
        row.forEach(function (k) {
          const b = document.createElement('button');
          b.type = 'button';
          if (k === '⇧') { b.className = 'ios-key ios-key--special ios-key--shift'; b.textContent = '⇧'; }
          else if (k === '⌫') { b.className = 'ios-key ios-key--special ios-key--bksp'; b.textContent = '⌫'; }
          else { b.className = 'ios-key'; b.textContent = shift ? k.toUpperCase() : k; }
          b.dataset.key = k;
          div.appendChild(b);
        });
        kb.appendChild(div);
      });
      const bottom = document.createElement('div');
      bottom.className = 'ios-kb-bottom';
      bottom.innerHTML =
        '<button type="button" class="ios-key ios-key--special" data-key="123">123</button>' +
        '<button type="button" class="ios-key ios-key--space" data-key=" ">space</button>' +
        '<button type="button" class="ios-key ios-key--return" data-key="\n">return</button>';
      kb.appendChild(bottom);
      const bar = document.createElement('div');
      bar.className = 'ios-kb-homebar';
      kb.appendChild(bar);
    }

    kb.addEventListener('pointerdown', function (e) {
      const b = e.target.closest('button[data-key]');
      if (!b) return;
      e.preventDefault();                      // не отбирать фокус у input
      const k = b.dataset.key;
      if (k === '⇧') { shift = !shift; render(); return; }
      if (k === '⌫') { input.value = input.value.slice(0, -1); return; }
      if (k === '123' || k === '\n') return;   // заглушки в демо
      input.value += shift ? k.toUpperCase() : k;
      if (shift) { shift = false; render(); }  // как в iOS: shift одноразовый
    });

    input.addEventListener('focus', function () { kb.dataset.open = 'true'; });
    render();
    // в демо открываем сразу, чтобы было видно без клика
    kb.dataset.open = 'true';
  })();
</script>
</body>
</html>
