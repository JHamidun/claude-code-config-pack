<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Android frame</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #ece9e2;
    font-family: "Roboto", "Helvetica Neue", system-ui, sans-serif;
  }

  .android-frame {
    width: 412px; height: 892px;
    background: #0d0d0d;
    border-radius: 44px;
    padding: 10px;
    box-shadow:
      0 0 0 2px #1a1a1a,
      0 30px 80px rgba(0,0,0,.35);
    position: relative;
  }
  .android-frame::before {
    content: ""; position: absolute; right: -3px; top: 160px;
    width: 3px; height: 60px; background: #222; border-radius: 2px;
  }

  .android-screen {
    width: 100%; height: 100%;
    background: #fff;
    border-radius: 36px;
    overflow: hidden;
    position: relative;
  }

  .android-status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 28px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px;
    font-size: 14px; font-weight: 500;
    z-index: 10;
  }
  .android-status-icons { display: flex; gap: 4px; }

  .android-camera {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px;
    background: #000; border-radius: 50%;
    z-index: 11;
  }

  .android-content {
    position: absolute;
    top: 28px; left: 0; right: 0; bottom: 24px;
    overflow: auto;
  }

  .android-nav-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 24px;
    display: grid; place-items: center;
    z-index: 10;
  }
  .android-nav-pill {
    width: 108px; height: 4px; background: #000; border-radius: 2px;
  }
</style>
</head>
<body>

<div class="android-frame">
  <div class="android-screen">

    <div class="android-camera"></div>

    <div class="android-status-bar">
      <span>09:24</span>
      <div class="android-status-icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
          <rect x="0"  y="8" width="2" height="4"/>
          <rect x="4"  y="5" width="2" height="7"/>
          <rect x="8"  y="2" width="2" height="10"/>
          <rect x="12" y="0" width="2" height="12"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 11a1 1 0 100-2 1 1 0 000 2zM8 7c1.5 0 2.8.5 3.9 1.5L13 7A7 7 0 008 5a7 7 0 00-5 2l1.1 1.5A5 5 0 018 7zM8 3a9 9 0 016 2.3L15 4A11 11 0 008 1a11 11 0 00-7 3l1 1.3A9 9 0 018 3z"/>
        </svg>
        <div style="width: 22px; height: 10px; border: 1.5px solid currentColor; border-radius: 2px; padding: 1px; box-sizing: border-box;">
          <div style="width: 75%; height: 100%; background: currentColor; border-radius: 1px;"></div>
        </div>
      </div>
    </div>

    <div class="android-content">
      <div style="padding: 24px;">
        <h1 style="font-size: 28px; margin: 0 0 16px; font-weight: 500;">Screen</h1>
        <p style="color: #666; margin: 0;">Замени содержимое <code>.android-content</code> своим макетом.</p>
      </div>
    </div>

    <div class="android-nav-bar">
      <div class="android-nav-pill"></div>
    </div>
  </div>
</div>

</body>
</html>
