<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Design canvas</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, system-ui, sans-serif;
    color: #f5f5f5;
    overflow: hidden;
  }

  .dc-viewport {
    position: fixed; inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .dc-viewport.dragging { cursor: grabbing; }

  .dc-scene {
    transform-origin: 0 0;
    padding: 80px;
    display: flex; flex-direction: column;
    gap: 120px;
    width: max-content;
  }

  dc-section {
    display: block;
  }
  .dc-section-title {
    font-size: 14px;
    font-family: ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 24px;
  }
  .dc-section-row {
    display: flex; gap: 80px; align-items: flex-start;
  }

  dc-artboard {
    display: block;
    background: #fff;
    color: #000;
    box-shadow: 0 30px 80px rgba(0,0,0,.4);
    overflow: hidden;
    cursor: pointer;
    border-radius: 4px;
  }
  .dc-artboard-label {
    color: #aaa;
    font-size: 13px;
    font-family: ui-monospace, monospace;
    margin-bottom: 12px;
  }
  .dc-artboard-frame {
    position: relative;
  }
  .dc-artboard-frame iframe {
    width: 100%; height: 100%; border: 0; display: block;
    pointer-events: none; /* при зум-ауте клики ловит сам артборд */
  }

  .dc-toolbar {
    position: fixed; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 8px 16px;
    display: flex; gap: 16px;
    font-size: 13px; color: #ccc;
    z-index: 100;
  }
  .dc-toolbar button {
    background: transparent; border: 0; color: #ccc; cursor: pointer;
    font: inherit;
  }
  .dc-toolbar button:hover { color: #fff; }

  /* focus mode */
  .dc-focus {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 200;
    display: none;
    place-items: center;
  }
  .dc-focus.active { display: grid; }
  .dc-focus-content {
    background: #fff;
    box-shadow: 0 30px 100px rgba(0,0,0,.6);
    overflow: hidden;
    transform-origin: center;
  }
  .dc-focus-close {
    position: fixed; top: 16px; right: 16px;
    background: rgba(255,255,255,.1); color: #fff;
    border: 0; border-radius: 8px; padding: 8px 12px;
    cursor: pointer; font: inherit;
  }
  .dc-focus-nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.1); color: #fff;
    border: 0; border-radius: 50%; width: 48px; height: 48px;
    cursor: pointer; font-size: 20px;
  }
  .dc-focus-nav.prev { left: 16px; }
  .dc-focus-nav.next { right: 16px; }
</style>
</head>
<body>

<div class="dc-viewport">
  <dc-canvas>
    <div class="dc-scene">

      <dc-section>
        <div class="dc-section-title">Section A — example</div>
        <div class="dc-section-row">
          <dc-artboard data-label="Variant 1" data-w="1200" data-h="600">
            <div class="dc-artboard-label">Variant 1</div>
            <div class="dc-artboard-frame" style="width: 1200px; height: 600px;">
              <div style="padding: 80px; font-size: 32px;">Замени содержимое артборда</div>
            </div>
          </dc-artboard>

          <dc-artboard data-label="Variant 2" data-w="1200" data-h="600">
            <div class="dc-artboard-label">Variant 2</div>
            <div class="dc-artboard-frame" style="width: 1200px; height: 600px; background: #111; color: #fff;">
              <div style="padding: 80px; font-size: 32px;">Тёмная версия</div>
            </div>
          </dc-artboard>
        </div>
      </dc-section>

    </div>
  </dc-canvas>
</div>

<div class="dc-toolbar">
  <button data-zoom="fit">Fit</button>
  <button data-zoom="100">100%</button>
  <button data-zoom="50">50%</button>
  <button data-zoom="25">25%</button>
  <span style="opacity: .6;" id="dc-zoom-display">100%</span>
</div>

<div class="dc-focus">
  <button class="dc-focus-nav prev">‹</button>
  <div class="dc-focus-content"></div>
  <button class="dc-focus-nav next">›</button>
  <button class="dc-focus-close">Esc</button>
</div>

<script>
(() => {
  const viewport = document.querySelector('.dc-viewport');
  const scene    = document.querySelector('.dc-scene');
  const zoomDisp = document.getElementById('dc-zoom-display');

  let scale = 1, x = 0, y = 0;
  function apply() {
    scene.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    zoomDisp.textContent = Math.round(scale * 100) + '%';
  }

  // Зум колесом + ctrl/⌘
  viewport.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const delta = -e.deltaY * 0.002;
      const next = Math.min(2, Math.max(0.1, scale * (1 + delta)));
      // зум вокруг курсора
      const rect = viewport.getBoundingClientRect();
      const px = e.clientX - rect.left, py = e.clientY - rect.top;
      x = px - (px - x) * (next / scale);
      y = py - (py - y) * (next / scale);
      scale = next;
    } else {
      x -= e.deltaX;
      y -= e.deltaY;
    }
    apply();
  }, { passive: false });

  // Drag
  let drag = null;
  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('dc-artboard')) return;
    drag = { sx: e.clientX, sy: e.clientY, ox: x, oy: y };
    viewport.classList.add('dragging');
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', e => {
    if (!drag) return;
    x = drag.ox + (e.clientX - drag.sx);
    y = drag.oy + (e.clientY - drag.sy);
    apply();
  });
  viewport.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });

  // Toolbar
  document.querySelectorAll('.dc-toolbar [data-zoom]').forEach(b => {
    b.addEventListener('click', () => {
      const v = b.dataset.zoom;
      if (v === 'fit') {
        const sb = scene.getBoundingClientRect();
        const vb = viewport.getBoundingClientRect();
        scale = Math.min(vb.width / sb.width * scale, vb.height / sb.height * scale) * 0.9;
        x = (vb.width  - sb.width  / scale * scale) / 2;
        y = (vb.height - sb.height / scale * scale) / 2;
      } else {
        scale = Number(v) / 100; x = 80; y = 80;
      }
      apply();
    });
  });

  // Focus mode
  const focus  = document.querySelector('.dc-focus');
  const fcont  = focus.querySelector('.dc-focus-content');
  const boards = Array.from(document.querySelectorAll('dc-artboard'));
  let fIndex = 0;

  function openFocus(i) {
    fIndex = (i + boards.length) % boards.length;
    const b = boards[fIndex];
    fcont.innerHTML = '';
    const w = +b.dataset.w, h = +b.dataset.h;
    const inner = b.querySelector('.dc-artboard-frame').cloneNode(true);
    inner.style.width = w + 'px'; inner.style.height = h + 'px';
    fcont.appendChild(inner);
    const vw = window.innerWidth - 100, vh = window.innerHeight - 100;
    const s = Math.min(vw / w, vh / h, 1);
    fcont.style.transform = `scale(${s})`;
    focus.classList.add('active');
  }
  boards.forEach((b, i) => b.addEventListener('click', () => openFocus(i)));
  focus.querySelector('.dc-focus-close').onclick = () => focus.classList.remove('active');
  focus.querySelector('.prev').onclick = () => openFocus(fIndex - 1);
  focus.querySelector('.next').onclick = () => openFocus(fIndex + 1);
  document.addEventListener('keydown', e => {
    if (!focus.classList.contains('active')) return;
    if (e.key === 'Escape')      focus.classList.remove('active');
    if (e.key === 'ArrowLeft')   openFocus(fIndex - 1);
    if (e.key === 'ArrowRight')  openFocus(fIndex + 1);
  });

  apply();
})();
</script>

</body>
</html>
