# Конфиг объекта мониторинга (книга). Аналог «объекта» Медиалогии.
# Скопируйте в config/<slug>.yaml и заполните под свою книгу.
# Плейсхолдеры в <УГЛОВЫХ СКОБКАХ> — заменить на свои значения.

title: "<НАЗВАНИЕ КНИГИ>"                 # точное название без подзаголовка
subtitle: "<ПОДЗАГОЛОВОК>"                # если есть, иначе ""
authors:
  - "<ИМЯ АВТОРА>"
  - "<ИМЯ ИЛЛЮСТРАТОРА>"                  # если есть
publisher: "<ИЗДАТЕЛЬСТВО>"
isbn: "<ISBN>"

# Якоря-дизамбигуаторы: упоминание засчитывается, если рядом с названием есть один из них.
# Решают проблему ОМОНИМА (когда название книги совпадает с другим проектом/изданием).
# Включайте: фамилию автора, иллюстратора, издательство, уникальный подзаголовок.
anchors:
  - "<ФАМИЛИЯ АВТОРА>"
  - "<ИЗДАТЕЛЬСТВО>"
  - "<УНИКАЛЬНЫЙ ПОДЗАГОЛОВОК>"

# Минус-слова: если есть в тексте И нет ни одного якоря — упоминание отбрасывается.
# Сюда — названия книг-омонимов и тематический шум.
exclude:
  - "<КНИГА-ОМОНИМ 1>"
  - "<КНИГА-ОМОНИМ 2>"

# Поисковые запросы: точная фраза названия в кавычках + варианты с автором.
queries:
  - '"<НАЗВАНИЕ КНИГИ>"'
  - '<ФАМИЛИЯ АВТОРА> "<НАЗВАНИЕ КНИГИ>"'

# Какие каналы включить (имена файлов в scripts/connectors/ без .py).
# Уберите те, для которых нет ключей/настроек.
channels:
  - googlenews          # бесплатно, без ключей
  - serpapi_connector   # нужен SERPAPI_API_KEY
  - vk                  # нужен SERPAPI_API_KEY (site:vk.com)
  - dzen                # нужен SERPAPI_API_KEY
  - livelib             # нужен SERPAPI_API_KEY (поиск страницы книги)
  - marketplace_stores  # нужен SERPAPI_API_KEY
  - youtube             # нужен GOOGLE_API_KEY или SCRAPECREATORS_API_KEY
  - scrapecreators      # нужен SCRAPECREATORS_API_KEY (Instagram/TikTok/Reddit)
  - rss_feeds           # бесплатно (список фидов ниже)
  - telegram            # нужен TG_CLIENT_PATH или TELEGRAM_API_ID/HASH/PHONE
  - rsshub_tg           # нужен RSSHUB_BASE_URL (или публичный rsshub.app)
  - wordstat            # опц., нужна YANDEX_WORDSTAT_COOKIE

# Telegram-каналы (slug без @) для коннектора rsshub_tg (издательства/книжные блоги).
telegram_channels:
  - "<tg_channel_slug>"

# Произвольные RSS-фиды профильных медиа для коннектора rss_feeds.
rss_feeds:
  - "https://godliteratury.ru/rss.xml"
  # - "https://<your-media>/rss"

# Период (для инкрементального режима — только новое с прошлого прогона).
period: { mode: incremental, days: 365 }

# Дайджест / алерты (опционально).
digest:
  telegram_chat: ""        # куда слать дайджест (chat_id или @username), пусто = не слать
  alert_on_negative: true  # мгновенный пуш при тональности Негатив

