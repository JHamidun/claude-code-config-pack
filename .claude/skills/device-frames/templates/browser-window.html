<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Browser window</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #d8d4cc;
    font-family: -apple-system, system-ui, sans-serif;
  }

  .browser {
    width: 1280px; height: 820px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.1), 0 30px 80px rgba(0,0,0,.25);
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  .browser-chrome {
    background: #ebe9e3;
    border-bottom: 1px solid #d4d2cc;
    flex-shrink: 0;
  }

  .browser-tabs {
    display: flex; align-items: end;
    padding: 8px 12px 0;
    gap: 4px;
  }
  .browser-traffic { display: flex; gap: 8px; padding: 0 12px 0 0; align-self: center; }
  .browser-traffic span {
    width: 12px; height: 12px; border-radius: 50%;
  }
  .browser-traffic .close    { background: #ff5f57; }
  .browser-traffic .minimize { background: #febc2e; }
  .browser-traffic .maximize { background: #28c840; }

  .browser-tab {
    background: #fff;
    padding: 8px 14px;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    color: #333;
    max-width: 220px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .browser-toolbar {
    display: flex; gap: 8px; align-items: center;
    padding: 8px 12px;
  }
  .browser-toolbar button {
    width: 28px; height: 28px;
    background: transparent; border: 0;
    border-radius: 4px;
    color: #666; font-size: 14px;
    cursor: pointer;
  }
  .browser-toolbar button:hover { background: rgba(0,0,0,.05); }

  .browser-url {
    flex: 1;
    background: #fff;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    color: #333;
    border: 1px solid #d4d2cc;
  }

  .browser-content {
    flex: 1;
    overflow: auto;
  }
</style>
</head>
<body>

<div class="browser">
  <div class="browser-chrome">
    <div class="browser-tabs">
      <div class="browser-traffic">
        <span class="close"></span>
        <span class="minimize"></span>
        <span class="maximize"></span>
      </div>
      <div class="browser-tab">Page title</div>
    </div>
    <div class="browser-toolbar">
      <button>‹</button>
      <button>›</button>
      <button>↻</button>
      <div class="browser-url">https://example.com</div>
    </div>
  </div>
  <div class="browser-content">
    <!-- Замени содержимое .browser-content своим макетом -->
    <div style="padding: 48px;">
      <h1>Page content</h1>
    </div>
  </div>
</div>

</body>
</html>
