<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI states — примеры для копирования</title>
<style>
  /* ===== обвязка страницы ===== */
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fafafa; color: #111; padding: 32px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .note { color: #666; font-size: 14px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .card {
    background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px;
  }
  .card > .label {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: #999; margin-bottom: 14px;
  }

  /* ===== Skeleton (из SKILL.md — копируй как есть) ===== */
  .skeleton .line {
    height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, #eee 0%, #f5f5f5 50%, #eee 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @media (prefers-reduced-motion) {
    .skeleton .line { animation: none; background: #eee; }
  }
  .skeleton .line + .line { margin-top: 10px; }
  .w-3\4 { width: 75%; } .w-1\2 { width: 50%; } .w-2\3 { width: 66%; }

  /* ===== Empty ===== */
  .empty { text-align: center; padding: 8px 4px; }
  .empty-icon {
    width: 56px; height: 56px; margin: 0 auto 12px;
    border-radius: 50%; background: #f0f0f0;
  }
  .empty h2 { font-size: 17px; margin-bottom: 6px; }
  .empty p { color: #666; font-size: 14px; margin-bottom: 14px; }

  /* ===== Error ===== */
  .error { padding: 4px; }
  .error h3 { font-size: 16px; margin-bottom: 6px; }
  .error p { color: #666; font-size: 14px; margin-bottom: 14px; }

  /* ===== кнопки ===== */
  button {
    font: 500 14px/1 inherit; padding: 10px 16px;
    border: 0; border-radius: 8px; cursor: pointer;
    background: #111; color: #fff;
  }
  button.secondary { background: transparent; color: #111; border: 1px solid #d4d4d4; }
  button + button { margin-left: 8px; }
</style>
</head>
<body>
  <h1>Состояния интерфейса</h1>
  <p class="note">Разметка блоков — из states-checklist/SKILL.md, копируй карточками.</p>

  <div class="grid">
    <div class="card">
      <div class="label">Loading — skeleton</div>
      <!-- Skeleton -->
      <div class="skeleton">
        <div class="line w-3/4"></div>
        <div class="line w-1/2"></div>
        <div class="line w-2/3"></div>
      </div>
    </div>

    <div class="card">
      <div class="label">Empty (cold)</div>
      <!-- Empty (cold) -->
      <div class="empty">
        <div class="empty-icon"><!-- placeholder --></div>
        <h2>Здесь будут ваши проекты</h2>
        <p>Начните с создания первого проекта.</p>
        <button>Создать проект</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Error</div>
      <!-- Error -->
      <div class="error" role="alert">
        <h3>Не удалось загрузить</h3>
        <p>Проверьте подключение и повторите.</p>
        <button>Повторить</button>
        <button class="secondary">Подробности</button>
      </div>
    </div>
  </div>

<script>
  /* классы вида w-3/4 из SKILL.md содержат «/», в CSS они заэкранированы как .w-3\4 —
     маппинг ниже даёт работать обеим формам записи */
  document.querySelectorAll('.skeleton .line').forEach(function (el) {
    ['3/4','1/2','2/3'].forEach(function (w) {
      if (el.classList.contains('w-' + w)) el.style.width = ({'3/4':'75%','1/2':'50%','2/3':'66%'})[w];
    });
  });
</script>
</body>
</html>
