<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Your Company mark">
  <title>Your Company mark</title>
  <!-- ЗАГЛУШКА: знак для круглого бейджа темы company. Первый path — фон
       знака (на бейдже красится в белый), остальные — рисунок поверх него
       (красится в цвет середины градиента). Свой знак: замените контуры,
       сохранив этот порядок. Простые формы: в круге 12 мм сложный знак
       превращается в кашу. -->
  <path fill="#FFFFFF" d="M50 2 A46 46 0 1 1 28.4 88.6 L8 96.5 L9.4 69.6 A46 46 0 0 1 50 2 Z"/>
  <path fill="#5656D2" d="M50 24 C50.8 36.5 55.5 41.2 76 46 C55.5 50.8 50.8 55.5 50 68 C49.2 55.5 44.5 50.8 24 46 C44.5 41.2 49.2 36.5 50 24 Z"/>
</svg>
